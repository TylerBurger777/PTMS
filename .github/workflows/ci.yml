name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux:
    name: Linux / ${{ matrix.simd }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [AVX2, SCALAR]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - run: |
          mkdir -p build && cd build
          cmake .. -DSIMD=${{ matrix.simd }} -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j $(nproc)
      - run: cd build && ctest --output-on-failure

  windows:
    name: Windows / ${{ matrix.simd }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [AVX2, SCALAR]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Verify libgomp
        run: |
          echo "=== libgomp search ==="
          find /mingw64 -name "libgomp*" 2>/dev/null
          echo "=== g++ -print-file-name ==="
          g++ -print-file-name=libgomp.dll.a
      - run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DSIMD=${{ matrix.simd }} -DCMAKE_BUILD_TYPE=Release
          cmake --build .
      - run: |
          cp /mingw64/bin/libgomp-1.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libstdc++-6.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-1.dll build/ 2>/dev/null || true
      - run: cd build && ctest --output-on-failure

  macos:
    name: macOS / SCALAR
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake libomp
      - run: |
          mkdir -p build && cd build
          cmake .. -DSIMD=SCALAR -DCMAKE_BUILD_TYPE=Release \
                   -DOpenMP_ROOT="$(brew --prefix libomp)"
          cmake --build . -j $(sysctl -n hw.ncpu)
      - run: cd build && ctest --output-on-failure

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =====================================================================
  # LINUX — GCC + OpenMP
  # =====================================================================
  linux:
    name: Linux / ${{ matrix.simd }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [AVX2, SCALAR]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DSIMD=${{ matrix.simd }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cd build && cmake --build . -j $(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

  # =====================================================================
  # WINDOWS — MSYS2 MinGW-w64 GCC
  # OpenMP path is resolved inside CMakeLists.txt via MINGW branch.
  # =====================================================================
  windows:
    name: Windows / ${{ matrix.simd }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [AVX2, SCALAR]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DSIMD=${{ matrix.simd }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cd build && cmake --build .

      - name: Copy MinGW runtime DLLs
        run: |
          cp /mingw64/bin/libgomp-1.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libstdc++-6.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-1.dll build/ 2>/dev/null || true

      - name: Test
        run: cd build && ctest --output-on-failure

  # =====================================================================
  # macOS — only SCALAR (Apple Silicon has no AVX2)
  # =====================================================================
  macos:
    name: macOS / SCALAR
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake libomp

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DSIMD=SCALAR -DCMAKE_BUILD_TYPE=Release \
                   -DOpenMP_ROOT="$(brew --prefix libomp)"

      - name: Build
        run: cd build && cmake --build . -j $(sysctl -n hw.ncpu)

      - name: Test
        run: cd build && ctest --output-on-failure
